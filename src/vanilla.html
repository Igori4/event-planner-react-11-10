<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Vanilla: рендер у DOM</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      let eventsCount = 3;

      // Ми самі пишемо функцію "рендеру" і самі викликаємо її щоразу,
      // коли змінюються дані
      function render() {
        document.getElementById("root").innerHTML = `
        <button id="btn">Найближчих подій: ${eventsCount}</button>
      `;
        // після кожного innerHTML треба ЗАНОВО навісити слухач,
        // бо старий DOM-вузол знищено разом зі старим innerHTML
        document.getElementById("btn").addEventListener("click", () => {
          console.log(eventsCount);
          eventsCount += 1;
          render();
        });
      }

      render();
    </script>
  </body>
</html>
